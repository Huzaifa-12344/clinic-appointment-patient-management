services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: \${POSTGRES_DB:-clinic}
      POSTGRES_USER: \${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: \${POSTGRES_PASSWORD:-clinic_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \${POSTGRES_USER:-clinic} -d \${POSTGRES_DB:-clinic}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    environment:
      VITE_API_URL: \${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "5173:80"

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      GENERIC_TIMEZONE: Asia/Karachi
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation:/files
    depends_on:
      - api
      - mailhog

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  n8n_data:
